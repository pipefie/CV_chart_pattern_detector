meta:
  schema_version: "1.0" 
  timeframe: "1h"
  comment: "Settings tuned for 1h bars on crypto & US large-caps; ATR-based thresholds sized for intraday noise."
  inherit_rule: "deep_merge"

common:
  atr:
    period: 14
    source: "hlc3"       # "close" | "hl2" | "hlc3"
    smoothing: "rma"     # "ema" | "sma" | "rma"
  units:
    # If a rule provides both *_atr and *_percent, which wins?
    prefer_atr_over_percent: true
  pivots:
    method: "prominence"          # ("prominence" | "savgol_peaks" | "swing_LR")
    use_atr_scaled: true           # treat thresholds in ATR units (intraday-friendly)
    min_prominence_atr: 1.2        # require clearer structure for peaks/valleys
    min_distance_bars: 8           # avoid micro-zigzags (prev 6)
    smoothing_window_bars: 5      # pre-smooth price series to reduce noise (prev 3)
    # Optional guards:
    max_pivots_per_window: 36      # cap to prevent “hairy” series from exploding combinations
    ignore_inside_gaps: true       # skip pivots across large price gaps

  lines:
    fit: "ransac"                  # "ols" | "ransac"
    ransac:
      max_trials: 100
      residual_threshold_pct_of_height: 0.02
    max_rmsd_pct_of_height: 0.35   # deviation from fitted line vs pattern height
    near_horizontal_max_deg: 12
    parallel_max_angle_diff_deg: 10

  windows:
    min_bars: 24                   # 1 day of 1h bars
    max_bars: 160                  # up to ~1 week
    step_bars: 4

  nms:
    iou_threshold: 0.35
    keep_top_k: 100

  labels_post:                            # ⚡️
    min_box_pixels: 18
    dedup_time_overlap_bars: 24          # keep only one candidate per day-long band

overrides:
  # Matchers are simple globs on symbol; timeframe exact match
  - match:
      symbols: ["BTC-USD","ETH-USD"]
      timeframe: "1h"
    pivots:
      min_prominence_atr: 1.4
      min_distance_bars: 10
    head_and_shoulders:
      geometry:
        head_above_shoulders_min_atr: 1.0
  - match:
      symbols: ["AAPL","NVDA","GOOGL","TSLA","AMZN","SPY","QQQ"]
      timeframe: "1h"
    units:
      prefer_atr_over_percent: false    # force use of % thresholds on low-ATR equities
    double_top:
      geometry:
        peak_height_similarity_pct: 6
        valley_drop_min_pct: 0.015
      breakout:
        confirm:
          threshold_percent: 0.35
          within_bars: 8
    double_bottom:
      geometry:
        peak_rise_min_pct: 0.015
      breakout:
        confirm:
          threshold_percent: 0.35

patterns:
  # 1) Head & Shoulders family (2 classes)
  head_and_shoulders:
    class_id: 0
    direction: "bearish"
    geometry:
      required_peaks: 3
      order: "peak-valley-peak-valley-peak"
      head_above_shoulders_min_atr: 0.8
      head_above_shoulders_min_pct: 0.01
      shoulder_height_similarity_pct: 25
      shoulder_timing_similarity_pct: 40
      neckline:
        type: "line"
        max_slope_deg: 12
        max_rmsd_pct_of_height: 0.4
      duration:
        min_bars: 36
        max_bars: 200
    breakout:
      side: "down"
      confirm:
        type: "close_beyond_line"
        threshold_atr: 0.35         # close ≤ neckline − 0.35×ATR
        threshold_percent: 0.12 
    invalidation:
      closes_back_above_neckline_within_bars: 10
      right_shoulder_exceeds_head_atr: 0.25
    trade_plan:
      entry: "next_open_after_breakout"
      stop:
        mode: "swing_point"
        swing: "above_right_shoulder"
      target:
        mode: "measured_move"       # (head - neckline)
        rr_fallback: 2.0
      risk:
        pct_of_equity: 0.5

  inverse_head_and_shoulders:
    class_id: 1
    direction: "bullish"
    inherits: "head_and_shoulders"
    breakout:
      side: "up"
      confirm:
        type: "close_beyond_line"
        threshold_atr: 0.35       # same 0.35 ATR in opposite direction
        threshold_percent: 0.12 
    trade_plan:
      stop:
        mode: "swing_point"
        swing: "below_right_shoulder"

  # 2) Double Top/Bottom family (2 classes)
  double_top:
    class_id: 2
    direction: "bearish"
    geometry:
      peaks: 2
      peak_height_similarity_pct: 8      # tighter symmetry window
      valley_required: true
      valley_drop_min_atr: 1.2           # require ≥1.2×ATR dip between peaks
      valley_drop_min_pct: 0.012          # fallback if ATR not preferred
      valley_min_bars_from_peaks: 4       # valley not glued to peaks
      max_pairs_per_peak: 5               # limit combinatorial explosions
      duration:
        min_bars: 24
        max_bars: 110
      neckline:
        type: "level"
        max_rmsd_pct_of_height: 0.3
    breakout:
      side: "down"
      confirm:
        type: "close_beyond_level"
        threshold_atr: 0.6          # close ≤ neckline − 0.6×ATR
        threshold_percent: 0.25      # fallback on % for low ATR regimes
        within_bars: 12             # confirm swiftly after 2nd peak
    # score choice if several candidates
    scoring:
      weight_valley_depth_atr: 1.0
      weight_span: 0.4
    invalidation:
      second_peak_exceeds_first_pct: 0.6
    trade_plan:
      entry: "next_open_after_breakout"
      stop:
        mode: "swing_point"
        swing: "above_second_peak"
      target:
        mode: "measured_move"

  double_bottom:
    class_id: 3
    direction: "bullish"
    inherits: "double_top"
    geometry:
      peak_rise_min_atr: 0.8
      peak_rise_min_pct: 0.008
      max_pairs_per_peak: 5
    breakout:
      side: "up"
      confirm:
        type: "close_beyond_level"
        threshold_percent: 0.12
    trade_plan:
      stop:
        mode: "swing_point"
        swing: "below_second_bottom"

  # 3) Descending Triangle (1 class; bullish twin not in this scope)
  descending_triangle:
    class_id: 4
    direction: "bearish"
    geometry:
      upper_trendline:
        type: "descending_line"
        min_touches: 3
        max_gap_bars: 12
      lower_boundary:
        type: "level"
        max_rmsd_pct_of_height: 0.35
      duration:
        min_bars: 24
        max_bars: 200
      apex_within_window_pct: 85
    breakout:
      side: "down"
      confirm:
        type: "close_beyond_level"
        threshold_atr: 0.3
    trade_plan:
      stop:
        mode: "atr"
        atr_mult: 1.6
      target:
        mode: "measured_move"        # widest part height
    hough:
      enabled: true
      canny:
        blur_ksize: 3
        t1: 50
        t2: 150
      houghp:
        rho: 1.0
        theta_deg: 1.0
        thresh: 45
        min_line_len: 40
        max_line_gap: 10
      # slope constraints (in degrees):
      upper_max_deg: -5        # must be negative and ≤ -5°
      lower_abs_max_deg: 4     # near-flat lower line
      min_support_lines: 3     # how many lines should support each sid

  ascending_triangle:                     # ⚡️ explicit disabled twins
    enabled: false
  symmetric_triangle:
    enabled: false
    
labels:
  0: "head_and_shoulders"
  1: "inverse_head_and_shoulders"
  2: "double_top"
  3: "double_bottom"
  4: "descending_triangle"
