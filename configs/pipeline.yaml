meta:
  comment: "End-to-end labeling + feature extraction pipeline config"

labeling:
  units:
    prefer_atr_over_percent: true
  labels_post:
    dedup_time_overlap_bars: 10
  swing_points:
    window: 4
    min_distance_bars: 4
    prominence_atr: 0.9
    atr_period: 14
  patterns:
    head_and_shoulders:
      geometry:
        duration:
          min_bars: 24
          max_bars: 180
        head_above_shoulders_min_atr: 0.45        # allow heads ~0.5 ATR above shoulders
        head_above_shoulders_min_pct: 0.0045
        shoulder_height_similarity_pct: 35
        shoulder_timing_similarity_pct: 75
        neckline:
          max_slope_deg: 18
      breakout:
        side: "down"
        confirm:
          threshold_atr: 0.08
          threshold_percent: 0.05
          within_bars: 22
    ascending_triangle:
      geometry:
        duration:
          min_bars: 30
          max_bars: 150
        max_peak_diff_pct: 0.01
        max_resistance_slope_deg: 8
        min_support_slope_deg: 10
        min_lows: 2
      breakout:
        side: "up"
        max_time_to_break_pct: 0.75
        confirm:
          threshold_atr: 0.1
          threshold_percent: 0.05
    double_top:
      geometry:
        peaks: 2
        peak_height_similarity_pct: 8
        min_height_atr: 1.1           # require taller structures
        valley_required: true
        valley_drop_min_atr: 1.2
        valley_drop_min_pct: 0.015
        valley_min_bars_from_peaks: 3
        max_pairs_per_peak: 5
        dynamic_thresholds:
          valley_drop_min_height_pct: 18
          breakout_height_pct: 9
          atr_floor_mult: 0.6
          vol_lookback_bars: 36
        duration:
          min_bars: 24
          max_bars: 110
      breakout:
        side: "down"
        require_confirmation: true
        confirm:
          threshold_atr: 0.8
          threshold_percent: 0.30
          within_bars: 14
          volume_mult: 1.2
      label_allow_pre_breakout: false
      scoring:
        weight_valley_depth_atr: 1.0
        weight_span: 0.4
    double_bottom:
      geometry:
        peak_height_similarity_pct: 8
        min_height_atr: 1.1
        valley_required: true
        peak_rise_min_atr: 1.2
        peak_rise_min_pct: 0.015
        valley_min_bars_from_peaks: 3
        max_pairs_per_peak: 5
        dynamic_thresholds:
          valley_drop_min_height_pct: 18
          breakout_height_pct: 9
          atr_floor_mult: 0.6
          vol_lookback_bars: 36
        duration:
          min_bars: 24
          max_bars: 110
      breakout:
        side: "up"
        require_confirmation: true
        confirm:
          threshold_atr: 0.8
          threshold_percent: 0.30
          within_bars: 14
          volume_mult: 1.2
      label_allow_pre_breakout: false
      scoring:
        weight_valley_depth_atr: 1.0
        weight_span: 0.4

features:
  ta:
    atr_period: 14
    roc_periods: [5, 10, 20]
    ma_periods: [10, 20, 50]
  candles:
    enabled: true
  swings:
    enabled: true
    pivot_left: 3
    pivot_right: 3
    pivot_min_sep: 4
  pattern_proxies:
    enabled: true

cv_features:
  hough:
    canny_low: 40
    canny_high: 140
    hough_rho: 1.0
    hough_theta_deg: 1.0
    hough_threshold: 70
    hough_horizontal_deg: 10
    grad_bins: 9
    hog_win: 64
    template_width: 64
  bovw:
    enabled: true
    vocab_path: "reports/cv_vocab/bovw_k64_seed42.joblib"
    n_clusters: 64
    max_keypoints: 500
    sample_images_for_vocab: 2000
    max_descriptors_total: 200000
    random_state: 42

dataset:
  manifest_path: "reports/runs/latest/render_manifest.json"

models:
  random_forest:
    n_estimators: 600
    max_depth: null
    min_samples_leaf: 2
    random_state: 42
